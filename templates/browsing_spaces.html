<!DOCTYPE html>
<html>
    <head>
        <title>Browsing Spaces</title>
        <link rel="stylesheet" href="/static/style.css" >
    </head>
    <body>
        <div class ='navbar'>
            <a href = '/index' class='logo'><img src 'https://icons8.com/icon/OFOIleplyyh7/airbnb' alt='logo'></a>
            <a href = '/browsing_spaces' class='item'>Browse Spaces</a>
            <a href ='/create_space' class='item'>Create a New Space</a>
        </div>
        <h1>List of Spaces</h1>
        {% for space in spaces %}
            <div>
            <!-- {{space.img_link}} -->
            <p>{{space.name}}</p>
            <p>{{space.details}}</p>
            <p>{{space.price}}</p>
            </div>
        {% endfor %}
    </body>
</html>
