<!DOCTYPE html>
<html>
    <head>
        <title>Create Space</title>
        <link rel="stylesheet" href="/static/style.css" >
    </head>
    <body>
      <form action="{{ url_for('logout') }}" method="POST">
      <div class ='navbar'>
        <img src = 'static/logo.png' alt='logo' width="60" height="80" class = 'item' id = 'logo'>
        <a href = '/user_dashboard' class='logo'>Dashboard</a>
        <p class = 'item'>|</p>
        <a href = '/browsing_spaces' class='item'>Browse Spaces</a>
        <p class = 'item'>|</p>
        <a href = '/create_space' class='item'>Create a New Space</a>
        <p class = 'item'>|</p>
        <p>{{session.user_name}}</p>
        <a><button class = 'logout' type="submit">Log Out</button></a>
      </form>
      </div>
      </form>
      </div>
        <div class="form" id ='new_space'>
        <h2>Create a new space:</h2>
        <form method="POST" action="/create_space">
        <label for= 'name'><p>What do you want to call your space?:</p></label>
        <input type="text" name="name" id = 'name' required/> 
        <label for= 'details'><p>How would you describe your space?:</p></label>
        <textarea type="text" name="details" id = 'details' rows="4" cols="50" required/></textarea>
        <labe for= 'price'><p>How much do you want to charge per night?:</p></labe>
        <input type="float" name="price" id= 'price' required/> 
        <label for= 'img_link'><p>Would you like to add an image link?:</p>
        <input type="text" name="img_link" id= 'img_link' />
        <button type="submit" class = 'new_space_button'><p>Submit</p></button>
        </form>
        </div>
    </body>
</html>
