<!DOCTYPE html>
<html>
    <head>
        <title>{{space.name}}</title>
        <link rel="stylesheet" href="/static/style.css" >
    </head>
    <body>
        <div class ='navbar'>
            <a href = '/user_dashboard' class='logo'><img src 'https://icons8.com/icon/OFOIleplyyh7/airbnb' alt='logo'></a>
            <a href = '/browsing_spaces' class='item'>Browse Spaces</a>
            <a href ='/create_space' class='item'>Create a New Space</a>
        </div>

        <h1>{{space.name}}</h1>
        <img src='{{space.img_link}}' alt='placeholder'>
        <p>Details: {{space.details}}</p>
        <p>£{{space.price}} per night</p>

        <h1>Request a booking:</h1>
        <div class="container">
            <form method="POST" action="/booking_requested">
                <p class='test'>Select Start Date: </p><input name='start_date' type="date"><br>
                <p>Select End Date: </p><input name='end_date' type="date"><br>
                <input type="hidden" name="flag" value="pending">
                <input type="hidden" name="user_id" value={{user_id}}>
                <input type="hidden" name="space_id" value={{space.id}}>
            
                <input type="submit" value="Submit Request">
                </form><br>

            <p><a href= '/browsing_spaces' class='item'>Back to Browsing</a></p>
        </div>

    </body>
</html>
