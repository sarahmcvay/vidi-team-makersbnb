<!DOCTYPE html>
<html>
<head>
    <title>{{ space.name }}</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <style>
        .flatpickr-day.approved {
            background: #e0e0e0;
            color: #999;
            cursor: not-allowed;
        }

        .flatpickr-day.pending {
            background: #fff3cd;
            color: #856404;
        }

        .message {
            margin: 15px 0;
            color: #856404;
            font-weight: bold;
        }
    </style>
</head>

<body>
<form action="{{ url_for('logout') }}" method="POST">
<div class ='navbar'>
  <img src = '/static/logo.png' alt='logo' width="60" height="80" class = 'item' id = 'logo'>
  <a href = '/user_dashboard' class='logo'>Dashboard</a>
  <p class = 'item'>|</p>
  <a href = '/browsing_spaces' class='item'>Browse Spaces</a>
  <p class = 'item'>|</p>
  <a href = '/create_space' class='item'>Create a New Space</a>
  <p class = 'item'>|</p>
  <a><button class = 'logout' type="submit">Log Out</button></a>
</form>
</div>
    <img src="{{ space.img_link }}" alt="placeholder">
    <p>{{ space.details }}</p>
    <p>£{{ space.price }} per night</p>

    <h1>Request a booking:</h1>

    <div class="message" id="pendingMessage" style="display: none;">
        A request has already been entered for these dates — approval is unlikely.
    </div>

    <form method="POST" action="/booking_requested">
        <input id="booking_range" type="text" placeholder="Select dates"><br><br>

        <input type="hidden" name="start_date" id="start_date">
        <input type="hidden" name="end_date" id="end_date">
        <input type="hidden" name="flag" value="pending">
        <input type="hidden" name="user_id" value="{{ user_id }}">
        <input type="hidden" name="space_id" value="{{ space.id }}">

        <input type="submit" value="Submit Request">
    </form>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        const approvedDates = {{ approved_dates | tojson }};
        const pendingDates = {{ pending_dates | tojson }};
        let calendar;

        function formatDate(date) {
            return date.toISOString().split("T")[0];
        }

        let lastSelectedRangeHasPending = false;

        function initCalendar(approved, pending) {
            calendar = flatpickr("#booking_range", {
                mode: "range",
                dateFormat: "Y-m-d",
                minDate: "today",
                disable: approved,

                onDayCreate(_, __, ___, dayElem) {
                    const dateStr = formatDate(dayElem.dateObj);

                    if (approved.includes(dateStr)) {
                        dayElem.classList.add("approved");
                    }

                    if (pending.includes(dateStr)) {
                        dayElem.classList.add("pending");
                    }
                },

                onChange(selectedDates, _, instance) {
                    document.getElementById('pendingMessage').style.display = "none";
                    lastSelectedRangeHasPending = false;

                    if (selectedDates.length === 2) {
                        const [start, end] = selectedDates;
                        let current = new Date(start);

                        while (current <= end) {
                            const d = formatDate(current);

                            if (approved.includes(d)) {
                                instance.clear();
                                alert("Accepted dates are blocked — please choose another range.");
                                return;
                            }

                            if (pending.includes(d)) {
                                lastSelectedRangeHasPending = true;
                            }

                            current.setDate(current.getDate() + 1);
                        }

                        if (lastSelectedRangeHasPending) {
                            document.getElementById('pendingMessage').style.display = "block";
                        }

                        document.getElementById("start_date").value = formatDate(start);
                        document.getElementById("end_date").value = formatDate(end);
                    }
                }
            });
        }

        function refreshCalendar(newApproved, newPending) {
            calendar.destroy();
            initCalendar(newApproved, newPending);
        }

        initCalendar(approvedDates, pendingDates);
    </script>
</body>
</html>
